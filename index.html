<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c2b29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nymphmaniac – Das Erbe der Smaragda</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loader">
  <div class="ld-in">
    <div class="ld-pre" id="ldPre">&nbsp;</div>
    <h1 id="ldTitle">NYMPH<span>MANIAC</span></h1>
    <div class="ld-sub" id="ldSub">&nbsp;</div>
    <svg class="ld-art" viewBox="0 0 240 110" aria-hidden="true">
      <path class="rod" d="M8 96 L96 14"/>
      <path class="ln" d="M96 14 C 150 6, 176 40, 178 78"/>
      <path class="sg a" d="M171.6 50 C 174.5 58, 176.4 66, 177.3 72"/>
      <path class="sg b" d="M166.5 39 C 168.6 42.5, 170.2 46, 171.6 50"/>
      <ellipse class="rg r1" cx="178" cy="82" rx="30" ry="6"/>
      <ellipse class="rg r2" cx="178" cy="82" rx="30" ry="6"/>
      <ellipse class="rg r3" cx="178" cy="82" rx="30" ry="6"/>
      <path class="wt" d="M0 82 H240"/>
    </svg>
    <div class="ld-bar"><i id="ldFill"></i></div>
    <div class="ld-st"><span id="ldStatus">&nbsp;</span><b id="ldPct">0 %</b></div>
  </div>
  <div class="ld-tip" id="ldTip"></div>
</div>
<canvas id="gl"></canvas>
<div id="vig"></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="revierInfo">
      <b id="rvName"></b>
      <span id="rvCond"></span>
      <div id="xpbar"><div id="xpfill"></div></div>
      <span id="xptext"></span>
      <div id="quest"></div>
    </div>
    <div id="menuBtns">
      <button id="btnJournal" aria-label="Tagebuch">📖</button>
      <button id="btnPov" aria-label="Sicht des Anglers">POV</button>
      <button id="btnSet" aria-label="Einstellungen">⚙️</button>
    </div>
  </div>

  <div id="read">
    <div id="depthG"><div id="depthZone"></div><div id="depthDot"></div><span id="depthTxt"></span></div>
    <div id="lupeWrap"><canvas id="lupe" width="220" height="220"></canvas></div>
  </div>
  <div id="gauge">
    <div class="zone"></div><div id="gMark"></div>
    <span class="l">lose</span><span class="c">Kontakt</span><span class="r">Zug</span>
  </div>

  <div id="fightUI">
    <div class="lab">Schnurspannung</div>
    <div class="bar" id="tBar"><div id="tFill"></div><div id="tLimit"></div></div>
    <div class="lab">Kraft des Fisches</div>
    <div class="bar small"><div id="sFill"></div></div>
  </div>
  <button id="btnRestart">↺ Strecke von vorn beginnen</button>
  <div id="fightArrow"><svg viewBox="0 0 100 100"><path d="M6 36h46V12l42 38-42 38V64H6z"/></svg></div>

  <div id="toast"></div>
  <div id="tip"></div>

  <div id="leftBtns">
    <div id="joy" aria-label="Waten"><div id="joyKnob"></div><small>waten</small></div>
    <div class="col">
      <button id="rig"></button>
      <div class="pair">
        <button id="btnStone" aria-label="Stein umdrehen">🪨<small>Stein</small></button>
        <button id="btnSwap" class="hidden" aria-label="Rute wechseln">⇄<small>Rute</small></button>
      </div>
    </div>
  </div>
  <button id="strike">ANHIEB</button>
  <button id="strikeL">DRILL</button>
  <div id="rodPad" aria-hidden="true"><i class="l"></i><i class="r"></i><i class="d"></i><div id="rodKnob"></div><small>▼ Druck</small></div>
</div>

<div id="title">
  <div class="tbox">
    <div class="pre">Ein Euro-Nymphing-Abenteuer</div>
    <h1>NYMPH<span>MANIAC</span></h1>
    <div class="sub">Das Erbe der Smaragda</div>
    <p>Opas Rute. Opas Fliegendose. Fünf Strecken eines smaragdgrünen Flusses – und ein Fisch, den er nie landen konnte.</p>
    <div id="langs"></div>
    <button id="btnStart" class="primary">Ans Wasser</button>
    <button id="btnNew" class="ghost hidden">Neues Spiel</button>
    <button id="btnMulti" class="ghost">Zu zweit fischen</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="modalCard">
    <button id="modalClose" aria-label="Schließen">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
